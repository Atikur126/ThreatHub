<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Blocklist Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); width: 100%; max-width: 500px; border: 1px solid #334155; }
        h2 { font-size: 1.4rem; margin-bottom: 8px; color: #38bdf8; text-align: center; }
        p.subtitle { font-size: 0.85rem; color: #94a3b8; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: #cbd5e1; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px 12px; background-color: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #ffffff; font-size: 0.9rem; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 10px; background-color: #0284c7; color: white; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #0369a1; }
        .alert { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.85rem; display: none; }
        .alert.success { background-color: #064e3b; color: #6ee7b7; border: 1px solid #047857; }
        .alert.error { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #b91c1c; }
    </style>
</head>
<body>

<div class="container">
    <h2>GitHub Blocklist Manager</h2>
    <p class="subtitle">Direct GitHub API Sync Panel</p>

    <div id="alertBox" class="alert"></div>

    <div class="form-group">
        <label>GitHub Personal Access Token (PAT):</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
    </div>

    <div class="form-group">
        <label>Enter Malicious Domain:</label>
        <input type="text" id="domainInput" placeholder="e.g., example-badsite.com" />
    </div>
    
    <button onclick="addDomainToGitHub()">Add to GitHub Blocklist</button>
</div>

<script>
    // আপনার Repo সম্পর্কিত তথ্য দিন
    const REPO_OWNER = "YOUR_GITHUB_USERNAME"; 
    const REPO_NAME = "YOUR_REPO_NAME";
    const FILE_PATH = "blocklist.txt"; // Repo-তে থাকা ফাইল নাম

    // Token LocalStorage-এ সেভ রাখা
    document.getElementById('ghToken').value = localStorage.getItem('gh_pat_token') || '';

    function showAlert(msg, type) {
        const box = document.getElementById('alertBox');
        box.className = `alert ${type}`;
        box.innerText = msg;
        box.style.display = 'block';
        setTimeout(() => box.style.display = 'none', 4000);
    }

    async function addDomainToGitHub() {
        const token = document.getElementById('ghToken').value.trim();
        let domain = document.getElementById('domainInput').value.trim().toLowerCase();
        domain = domain.replace(/^https?:\/\//, '').replace(/\/.*$/, '');

        if (!token) return showAlert("GitHub Access Token দিন!", "error");
        if (!domain) return showAlert("সঠিক ডোমেইন নাম দিন!", "error");

        localStorage.setItem('gh_pat_token', token);

        const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

        try {
            showAlert("GitHub-এর সাথে কানেক্ট করা হচ্ছে...", "success");

            // ১. বর্তমান ফাইল রিড করা
            let getResponse = await fetch(apiUrl, {
                headers: { "Authorization": `token ${token}` }
            });

            let fileSha = "";
            let currentContent = "";

            if (getResponse.status === 200) {
                let fileData = await getResponse.json();
                fileSha = fileData.sha;
                currentContent = decodeURIComponent(escape(atob(fileData.content)));
            } else if (getResponse.status !== 404) {
                throw new Error("ফাইল রিড করতে ব্যর্থ! Token বা Repo তথ্য চেক করুন।");
            }

            // ২. ডুপ্লিকেট চেক
            let domainList = currentContent.split('\n').map(d => d.trim()).filter(Boolean);
            if (domainList.includes(domain)) {
                return showAlert("ডোমেইনটি আগেই ব্লক লিস্টে আছে!", "error");
            }

            // ৩. নতুন লিস্ট তৈরি ও Base64 Encode
            domainList.push(domain);
            domainList.sort();
            let updatedContent = domainList.join('\n');
            let encodedContent = btoa(unescape(encodeURIComponent(updatedContent)));

            // ৪. GitHub API দিয়ে Commit করা
            let putResponse = await fetch(apiUrl, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: `Added ${domain} via Web Panel`,
                    content: encodedContent,
                    sha: fileSha ? fileSha : undefined
                })
            });

            if (putResponse.ok) {
                showAlert(`সফলভাবে "${domain}" ব্লক লিস্টে যোগ হয়েছে!`, "success");
                document.getElementById('domainInput').value = '';
            } else {
                let err = await putResponse.json();
                showAlert("Commit ব্যর্থ: " + (err.message || "অজানা সমস্যা"), "error");
            }

        } catch (error) {
            showAlert(error.message, "error");
        }
    }
</script>

</body>
</html>
